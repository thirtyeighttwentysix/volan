console-reports:
  active: true

complexity:
  CyclomaticComplexMethod:
    # A `when` that maps one token to one result is a table, not branching logic.
    ignoreSimpleWhenEntries: true
  LongParameterList:
    allowedFunctionParameters: 8
    allowedConstructorParameters: 12
    ignoreDefaultParameters: true
  TooManyFunctions:
    allowedFunctionsPerClass: 30
    allowedFunctionsPerFile: 30
    allowedFunctionsPerObject: 30
    ignorePrivate: true
    ignoreOverridden: true

style:
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  LoopWithTooManyJumpStatements:
    # Scanner loops legitimately leave from more than one place: end of input, end of line, delimiter.
    maxJumpCount: 3
  ForbiddenComment:
    active: true
    comments:
      - reason: "Unfinished work must be tracked in ROADMAP.md, not left in the code."
        value: "TODO:"
      - reason: "Unfinished work must be tracked in ROADMAP.md, not left in the code."
        value: "FIXME:"
      - reason: "Unfinished work must be tracked in ROADMAP.md, not left in the code."
        value: "STOPSHIP:"
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true

exceptions:
  TooGenericExceptionCaught:
    active: true
  # Fails the build on `TODO()`, which throws NotImplementedError. Placeholder implementations belong
  # in ROADMAP.md, not in the main branch.
  NotImplementedDeclaration:
    active: true

naming:
  FunctionNaming:
    excludes: ["**/test/**", "**/*Test.kt"]

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
