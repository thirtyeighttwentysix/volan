<svg xmlns="http://www.w3.org/2000/svg" width="760" height="586" viewBox="0 0 760 586" role="img" aria-labelledby="title desc">
<title id="title">PostgreSQL: Update and commit</title>
<desc id="desc">Mean microseconds per operation. Lower is better. Both panels use the same scale. The accompanying tables provide 99.9% confidence intervals.</desc>
<rect x="1" y="1" width="758" height="584" rx="20" fill="#F7FAFC" stroke="#DCE5EA" stroke-width="2"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#162C39">
<text x="30" y="55" font-size="38" font-weight="700">Update and commit</text>
<text x="30" y="88" font-size="23">PostgreSQL latency, µs/op</text>
<text x="730" y="88" font-size="23" text-anchor="end">Lower is better</text>
<rect x="20" y="112" width="720" height="219" rx="13" fill="#FFFFFF" stroke="#DCE5EA"/>
<text x="40" y="146" font-size="26" font-weight="700">1 row</text>
<text x="40" y="182" font-size="24" fill="#0E574A" font-weight="700">Volan</text>
<rect x="170" y="164" width="291.34" height="22" rx="3" fill="#167061"/>
<text x="717" y="182" font-size="24" fill="#0E574A" font-weight="700" text-anchor="end">5,844.5</text>
<text x="40" y="213" font-size="24" fill="#162C39" font-weight="500">Hibernate</text>
<rect x="170" y="195" width="369.37" height="22" rx="3" fill="#698D9E"/>
<text x="717" y="213" font-size="24" fill="#162C39" font-weight="500" text-anchor="end">7,409.8</text>
<text x="40" y="244" font-size="24" fill="#162C39" font-weight="500">Exposed</text>
<rect x="170" y="226" width="412.00" height="22" rx="3" fill="#698D9E"/>
<text x="717" y="244" font-size="24" fill="#162C39" font-weight="500" text-anchor="end">8,264.9</text>
<text x="40" y="275" font-size="24" fill="#162C39" font-weight="500">jOOQ</text>
<rect x="170" y="257" width="376.33" height="22" rx="3" fill="#698D9E"/>
<text x="717" y="275" font-size="24" fill="#162C39" font-weight="500" text-anchor="end">7,549.3</text>
