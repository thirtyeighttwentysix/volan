<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">PostgreSQL: Update and commit</title>
<desc id="desc">Mean microseconds per operation with 99.9% confidence intervals. Lower is better. Separate axes for 1 and 100 rows. Negative lower bounds are clipped at zero.</desc>
<rect width="1100" height="660" rx="16" fill="#101827"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#edf2fa">
<text x="40" y="52" font-size="25" font-weight="700">PostgreSQL: Update and commit</text>
<text x="40" y="81" font-size="15" fill="#a7b5ca">Mean latency; lower is better; error bars show 99.9% confidence intervals</text>
<text x="40" y="124" font-size="19" font-weight="600">1 row</text>
<text x="40" y="163" font-size="15">jOOQ</text>
<rect x="155" y="143" width="256.37" height="27" rx="4" fill="#3c638a"/>
<path d="M 200.51,156 H 622.22 M 200.51,151 v 10 M 622.22,151 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="163" font-size="15">5047.0 ± 4151.0 µs</text>
<text x="40" y="199" font-size="15">JDBC</text>
<rect x="155" y="179" width="278.24" height="27" rx="4" fill="#7e98b7"/>
<path d="M 207.93,192 H 658.55 M 207.93,187 v 10 M 658.55,187 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="199" font-size="15">5477.7 ± 4435.6 µs</text>
<text x="40" y="235" font-size="15">Hibernate</text>
<rect x="155" y="215" width="294.18" height="27" rx="4" fill="#3c638a"/>
<path d="M 211.40,228 H 686.96 M 211.40,223 v 10 M 686.96,223 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="235" font-size="15">5791.4 ± 4681.1 µs</text>
<text x="40" y="271" font-size="15">Volan</text>
<rect x="155" y="251" width="297.32" height="27" rx="4" fill="#8db8e8"/>
<path d="M 222.60,264 H 682.04 M 222.60,259 v 10 M 682.04,259 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="271" font-size="15">5853.2 ± 4522.4 µs</text>
<text x="40" y="307" font-size="15">Exposed</text>
<rect x="155" y="287" width="391.41" height="27" rx="4" fill="#3c638a"/>
<path d="M 247.82,300 H 845.00 M 247.82,295 v 10 M 845.00,295 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="307" font-size="15">7705.6 ± 5878.3 µs</text>
<text x="40" y="370" font-size="19" font-weight="600">100 rows</text>
<text x="40" y="409" font-size="15">JDBC</text>
<rect x="155" y="389" width="247.21" height="27" rx="4" fill="#7e98b7"/>
<path d="M 155.00,402 H 657.76 M 155.00,397 v 10 M 657.76,397 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="409" font-size="15">4020.6 ± 4156.2 µs</text>
<text x="40" y="445" font-size="15">Exposed</text>
<rect x="155" y="425" width="335.27" height="27" rx="4" fill="#3c638a"/>
<path d="M 210.02,438 H 770.52 M 210.02,433 v 10 M 770.52,433 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="445" font-size="15">5452.7 ± 4557.9 µs</text>
<text x="40" y="481" font-size="15">Volan</text>
<rect x="155" y="461" width="372.25" height="27" rx="4" fill="#8db8e8"/>
<path d="M 247.82,474 H 806.67 M 247.82,469 v 10 M 806.67,469 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="481" font-size="15">6054.1 ± 4544.5 µs</text>
<text x="40" y="517" font-size="15">Hibernate</text>
<rect x="155" y="497" width="397.83" height="27" rx="4" fill="#3c638a"/>
<path d="M 296.04,510 H 809.61 M 296.04,505 v 10 M 809.61,505 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="517" font-size="15">6470.1 ± 4176.3 µs</text>
<text x="40" y="553" font-size="15">jOOQ</text>
<rect x="155" y="533" width="428.75" height="27" rx="4" fill="#3c638a"/>
<path d="M 322.50,546 H 845.00 M 322.50,541 v 10 M 845.00,541 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="553" font-size="15">6973.1 ± 4248.9 µs</text>
<text x="40" y="623" fill="#a7b5ca" font-size="14">10,000 baseline rows; 1 thread(s); four pooled connections; transaction per operation</text>
</g></svg>