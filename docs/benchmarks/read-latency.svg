<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">PostgreSQL: Read, one thread</title>
<desc id="desc">Mean microseconds per operation with 99.9% confidence intervals. Lower is better. Separate axes for 1 and 100 rows. Negative lower bounds are clipped at zero.</desc>
<rect width="1100" height="660" rx="16" fill="#101827"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#edf2fa">
<text x="40" y="52" font-size="25" font-weight="700">PostgreSQL: Read, one thread</text>
<text x="40" y="81" font-size="15" fill="#a7b5ca">Mean latency; lower is better; error bars show 99.9% confidence intervals</text>
<text x="40" y="124" font-size="19" font-weight="600">1 row</text>
<text x="40" y="163" font-size="15">JDBC</text>
<rect x="155" y="143" width="335.21" height="27" rx="4" fill="#7e98b7"/>
<path d="M 483.22,156 H 497.19 M 483.22,151 v 10 M 497.19,151 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="163" font-size="15">1103.5 ± 23.0 µs</text>
<text x="40" y="199" font-size="15">jOOQ</text>
<rect x="155" y="179" width="352.45" height="27" rx="4" fill="#3c638a"/>
<path d="M 495.21,192 H 519.69 M 495.21,187 v 10 M 519.69,187 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="199" font-size="15">1160.3 ± 40.3 µs</text>
<text x="40" y="235" font-size="15">Hibernate</text>
<rect x="155" y="215" width="353.89" height="27" rx="4" fill="#3c638a"/>
<path d="M 480.20,228 H 537.58 M 480.20,223 v 10 M 537.58,223 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="235" font-size="15">1165.0 ± 94.4 µs</text>
<text x="40" y="271" font-size="15">Exposed</text>
<rect x="155" y="251" width="479.97" height="27" rx="4" fill="#3c638a"/>
<path d="M 627.36,264 H 642.58 M 627.36,259 v 10 M 642.58,259 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="271" font-size="15">1580.1 ± 25.1 µs</text>
<text x="40" y="307" font-size="15">Volan</text>
<rect x="155" y="287" width="665.60" height="27" rx="4" fill="#8db8e8"/>
<path d="M 796.20,300 H 845.00 M 796.20,295 v 10 M 845.00,295 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="307" font-size="15">2191.2 ± 80.3 µs</text>
<text x="40" y="370" font-size="19" font-weight="600">100 rows</text>
<text x="40" y="409" font-size="15">JDBC</text>
<rect x="155" y="389" width="364.73" height="27" rx="4" fill="#7e98b7"/>
<path d="M 510.10,402 H 529.36 M 510.10,397 v 10 M 529.36,397 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="409" font-size="15">1198.7 ± 31.7 µs</text>
<text x="40" y="445" font-size="15">jOOQ</text>
<rect x="155" y="425" width="383.09" height="27" rx="4" fill="#3c638a"/>
<path d="M 520.87,438 H 555.30 M 520.87,433 v 10 M 555.30,433 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="445" font-size="15">1259.0 ± 56.6 µs</text>
<text x="40" y="481" font-size="15">Hibernate</text>
<rect x="155" y="461" width="390.00" height="27" rx="4" fill="#3c638a"/>
<path d="M 528.66,474 H 561.34 M 528.66,469 v 10 M 561.34,469 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="481" font-size="15">1281.7 ± 53.7 µs</text>
<text x="40" y="517" font-size="15">Exposed</text>
<rect x="155" y="497" width="525.44" height="27" rx="4" fill="#3c638a"/>
<path d="M 654.56,510 H 706.31 M 654.56,505 v 10 M 706.31,505 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="517" font-size="15">1726.9 ± 85.0 µs</text>
<text x="40" y="553" font-size="15">Volan</text>
<rect x="155" y="533" width="679.36" height="27" rx="4" fill="#8db8e8"/>
<path d="M 823.72,546 H 845.00 M 823.72,541 v 10 M 845.00,541 v 10" stroke="#f4f7fb" stroke-width="1.5"/>
<text x="880" y="553" font-size="15">2232.7 ± 35.0 µs</text>
<text x="40" y="623" fill="#a7b5ca" font-size="14">10,000 baseline rows; 1 thread(s); four pooled connections; transaction per operation</text>
</g></svg>