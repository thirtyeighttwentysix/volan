<text x="717" y="417" font-size="24" fill="#0E574A" font-weight="700" text-anchor="end">2,123.6</text>
<text x="40" y="448" font-size="24" fill="#162C39" font-weight="500">Hibernate</text>
<rect x="170" y="430" width="317.10" height="22" rx="3" fill="#698D9E"/>
