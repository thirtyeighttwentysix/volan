name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      candidate_version:
        description: 'Unsigned branch rehearsal version (empty uses the project version)'
        required: false
        default: ''
        type: string
      published_tag:
        description: 'Verify an already uploaded tag and finish its GitHub release without uploading again'
        required: false
        default: ''
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false
    "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process

jobs:
  release:
    name: Verify artifacts and release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.published_tag || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Read and validate version
        id: version
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          PUBLISHED_TAG: ${{ inputs.published_tag }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_version.py'
          ref_type="$GITHUB_REF_TYPE"
          ref_name="$GITHUB_REF_NAME"
          if [[ -n "$PUBLISHED_TAG" ]]; then
            ref_type=tag
            ref_name="$PUBLISHED_TAG"
          fi
          version=$(python3 scripts/release-version.py --ref-type "$ref_type" --ref-name "$ref_name" --candidate "$CANDIDATE_VERSION")
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$ref_name" >> "$GITHUB_OUTPUT"

      - name: Check publishing secrets
        if: startsWith(github.ref, 'refs/tags/') && !inputs.published_tag
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          for variable in CENTRAL_USERNAME CENTRAL_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing release secret: $variable"
              exit 1
            fi
          done
          test -s docs/release-signing-key.asc

      - name: Build, test and check public API
        if: ${{ !inputs.published_tag }}
        run: ./gradlew build apiCheck :volan-migrate:koverVerify --stacktrace

      - name: Stage unsigned artifacts for a rehearsal
        if: "!startsWith(github.ref, 'refs/tags/') && !inputs.published_tag"
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./gradlew publishAllPublicationsToReleaseTestRepository "-Pversion=$VERSION" -PvolanUnsignedLocalPublication --no-configuration-cache --stacktrace

      - name: Stage signed release artifacts
        if: startsWith(github.ref, 'refs/tags/') && !inputs.published_tag
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToReleaseTestRepository --no-configuration-cache --stacktrace

      - name: Verify contents, metadata, checksums and signatures
        if: ${{ !inputs.published_tag }}
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          signature_args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            signature_args=(--public-key docs/release-signing-key.asc)
          fi
          python3 scripts/verify-release.py --version "$VERSION" "${signature_args[@]}"

      - name: Consume staged artifacts in an independent project
        if: ${{ !inputs.published_tag }}
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./gradlew -p release-smoke clean test "-PvolanVersion=$VERSION" "-PvolanRepository=$GITHUB_WORKSPACE/build/release-repository" --stacktrace

      - name: Build with staged Gradle and Maven plugins
        if: ${{ !inputs.published_tag }}
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/verify-plugins.py --version "$VERSION" --repository build/release-repository

      - name: Run documentation examples from staged artifacts
        if: ${{ !inputs.published_tag }}
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/verify-examples.py --version "$VERSION" --repository build/release-repository

      - name: Publish to Maven Central
        if: startsWith(github.ref, 'refs/tags/') && !inputs.published_tag
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace

      - name: Download and verify artifacts from Maven Central
        if: startsWith(github.ref, 'refs/tags/') || inputs.published_tag != ''
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: >-
          python3 scripts/verify-release.py --central --version "$VERSION"
          --repository build/central-repository --public-key docs/release-signing-key.asc --wait-seconds 3600

      - name: Consume Maven Central release
        if: startsWith(github.ref, 'refs/tags/') || inputs.published_tag != ''
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./gradlew -p release-smoke clean test "-PvolanVersion=$VERSION" --refresh-dependencies --stacktrace

      - name: Consume Gradle and Maven plugins from Central
        if: startsWith(github.ref, 'refs/tags/') || inputs.published_tag != ''
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/verify-plugins.py --version "$VERSION"

      - name: Run documentation examples from Maven Central
        if: startsWith(github.ref, 'refs/tags/') || inputs.published_tag != ''
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/verify-examples.py --version "$VERSION"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.published_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          args=()
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          ./gradlew :volan-cli:installDist "-Pversion=$VERSION" --stacktrace
          python3 scripts/package-cli.py
          python3 scripts/test-installers.py --assets build/cli-release
          if gh release view "$RELEASE_TAG" --json assets > build/existing-release.json 2>/dev/null; then
            python3 -c 'import json; names={a["name"] for a in json.load(open("build/existing-release.json"))["assets"]}; required={"volan-cli.zip","volan-cli.tar.gz","install.ps1","install.sh","SHA256SUMS"}; assert required <= names, "Existing release is missing CLI assets"'
            echo "GitHub release already has its CLI assets: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Volan $VERSION" --notes-file "docs/releases/$VERSION.md" "${args[@]}" build/cli-release/*
          fi

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: |
            **/build/reports/tests/**
            **/build/publications/**/*.pom
          retention-days: 14

      - name: Upload unsigned candidate repository
        if: "success() && !startsWith(github.ref, 'refs/tags/') && !inputs.published_tag"
        uses: actions/upload-artifact@v7
        with:
          name: candidate-repository-${{ steps.version.outputs.value }}
          path: build/release-repository/**
          retention-days: 14
