name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false
    "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process

jobs:
  cli-installers:
    name: CLI installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Test install, upgrade, PATH and failure recovery
        run: python scripts/test-installers.py

  build:
    name: build (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: '**/build/reports/tests/**'
          retention-days: 7

  cli-launcher:
    name: CLI launcher (${{ matrix.os }}, JDK 25)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Test packaged CLI with native access enforcement
        run: ./gradlew :volan-cli:test --stacktrace

  static-analysis:
    name: detekt + ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: detekt
        run: ./gradlew detekt --stacktrace

      - name: Upload detekt SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-sarif
          path: '**/build/reports/detekt/*.sarif'
          retention-days: 7

  api-compatibility:
    name: public API check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: apiCheck
        run: ./gradlew apiCheck --stacktrace

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Generate coverage report
        run: ./gradlew koverXmlReport --stacktrace

      - name: Verify migration coverage across supported databases
        run: ./gradlew :volan-migrate:koverVerify --stacktrace

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/reports/kover/report.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-plugins:
    name: Gradle and Maven consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Read candidate version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          echo "value=${version%-SNAPSHOT}" >> "$GITHUB_OUTPUT"
      - name: Stage build plugins and runtime
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./gradlew publishAllPublicationsToReleaseTestRepository "-Pversion=$VERSION" -PvolanUnsignedLocalPublication --no-configuration-cache --stacktrace
      - name: Verify release artifacts and plugin descriptors
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/verify-release.py --version "$VERSION"
      - name: Build independent projects through the plugins
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/verify-plugins.py --version "$VERSION" --repository build/release-repository
      - name: Upload consumer reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-plugin-consumer-reports
          path: |
            build/plugin-smoke/gradle/build/reports/tests/**
            build/plugin-smoke/maven/target/surefire-reports/**
