[versions]
kotlin = "2.4.10"
coroutines = "1.11.0"
kotlinpoet = "2.3.0"
clikt = "5.1.0"
hikari = "7.1.0"
slf4j = "2.0.18"
jspecify = "1.0.1"
micrometer = "1.17.0"
jackson = "2.22.1"

postgres = "42.7.13"
mysql = "9.7.0"
mariadb = "3.5.9"
sqlite = "3.53.2.1"
h2 = "2.4.240"

junit = "6.1.2"
kotest = "6.2.3"
testcontainers = "2.0.5"

detekt = "2.0.0-alpha.5"
ktlintPlugin = "14.2.0"
ktlint = "1.7.1"
kover = "0.9.9"
dokka = "2.2.0"
pluginPublish = "2.1.1"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-jdk8 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
clikt = { module = "com.github.ajalt.clikt:clikt-jvm", version.ref = "clikt" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

jdbc-postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }
jdbc-mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
jdbc-mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
jdbc-sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
jdbc-h2 = { module = "com.h2database:h2", version.ref = "h2" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property-jvm", version.ref = "kotest" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgres = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb" }

# Plugin marker coordinates, used by the `build-logic` included build.
build-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
build-ktlint = { module = "org.jlleitschuh.gradle.ktlint:org.jlleitschuh.gradle.ktlint.gradle.plugin", version.ref = "ktlintPlugin" }
build-detekt = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
build-kover = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
build-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish" }
